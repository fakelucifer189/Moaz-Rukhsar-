<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moaz & Rukhsar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #fff5f8;
      color: #2d1b22;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(214, 51, 108, 0.14);
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      color: #c2185b;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #6d4c57;
      margin-bottom: 18px;
    }
    .open-btn {
      background: #e91e63;
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .gallery-wrap {
      display: none;
      margin-top: 10px;
    }
    .gallery-wrap.active {
      display: block;
    }
    .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #fce4ec;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .caption {
      font-size: 14px;
      font-weight: 600;
      color: #3a1f28;
      margin-bottom: 6px;
    }
    .date-line {
      font-size: 12px;
      color: #8d6e63;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #f48fb1;
      background: #fff0f5;
      color: #ad1457;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Moaz &amp; Rukhsar</h1>
    <p class="subtitle">Hamari special yaadein</p>

    <button class="open-btn" id="openBtn" onclick="openGallery()">Tap to Open</button>

    <div class="gallery-wrap" id="galleryWrap">
      <div class="photo-frame">
        <img id="slideImg" src="IMG_20261125_203845.png" alt="Memory Photo" />
      </div>
      <div class="caption" id="slideCaption">Memory 1</div>
      <div class="date-line" id="dateLine">Monday, 13 July 2026 • 2:47 AM</div>

      <div class="controls">
        <button class="nav-btn" onclick="prevSlide()">Previous</button>
        <button class="nav-btn" onclick="nextSlide()">Next</button>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      { src: "IMG_20261125_203845.png", caption: "Memory 1", showDate: true },
      { src: "IMG_20261125_203740.jpg", caption: "Memory 2", showDate: false },
      { src: "IMG_20261125_203820.png", caption: "Memory 3", showDate: false },
      { src: "IMG_20261125_203756.jpg", caption: "Memory 4", showDate: false },
      { src: "IMG_20261125_203800.jpg", caption: "Memory 5", showDate: false }
    ];

    let currentIndex = 0;

    function openGallery() {
      document.getElementById("openBtn").style.display = "none";
      document.getElementById("galleryWrap").classList.add("active");
      renderSlide();
    }

    function renderSlide() {
      const item = slides[currentIndex];
      const imgEl = document.getElementById("slideImg");
      const capEl = document.getElementById("slideCaption");
      const dateEl = document.getElementById("dateLine");

      imgEl.src = item.src;
      capEl.textContent = item.caption;
      dateEl.style.display = item.showDate ? "block" : "none";
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      renderSlide();
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      renderSlide();
    }
  </script>
</body>
</html>
